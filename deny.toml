# Only check what we ship. Add the Windows/Linux targets when those ports
# start; the Linux tray stack (GTK) currently pulls in two advisories
# (RUSTSEC-2024-0370, RUSTSEC-2024-0429) to deal with then.
[graph]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[advisories]
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
