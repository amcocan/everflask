[package]
name = "everflask"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
everflask-core = { path = "../everflask-core" }
everflask-platform = { path = "../everflask-platform" }
tao = "0.37.1"
tray-icon = "0.26.1"

[lints]
workspace = true

[build-dependencies]
resvg = "0.48.1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSResponder", "NSAppearance", "block2", "NSImage", "NSRunningApplication", "NSAlert", "NSApplication", "NSPanel", "NSWindow", "libc"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSThread", "NSData", "NSGeometry", "NSDate"] }
