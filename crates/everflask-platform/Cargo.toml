[package]
name = "everflask-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
everflask-core = { path = "../everflask-core" }

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace"] }
objc2-application-services = { version = "0.3", default-features = false, features = ["std", "HIServices", "AXUIElement"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventTypes", "CGEventSource"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSUserDefaults", "NSString", "NSDictionary", "NSArray", "NSBundle", "NSURL", "NSFileManager", "NSError", "NSPathUtilities", "NSEnumerator"] }
